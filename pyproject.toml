[project]
name = "tmnt-design-studio"
version = "0.5.0"
description = "Knowledge-driven deck design tools for TMNT Design Studio"
requires-python = ">=3.12"
dependencies = ["typer>=0.12,<1"]

[project.scripts]
tmnt = "tmnt_design_studio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/cardcade/CALIBRATION_V1_*/**"]

[tool.ruff.format]
# These are byte-pinned review artifacts. Keep their recorded source/test bytes
# intact; active code and tests remain subject to the normal Ruff formatter.
exclude = [
    ".diag003-memory-independent-review/verifier-trust-review/corrected/verify_completed_batch.py",
    ".diag003-memory-independent-review/verifier-trust-review/test_corrected_verifier_integrity.py",
    ".diag003-memory-independent-review/verifier-trust-review/test_verify_completed_batch_trust.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
