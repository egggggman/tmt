[project]
name = "tmnt-design-studio"
version = "0.5.0"
description = "Knowledge-driven deck design tools for TMNT Design Studio"
requires-python = ">=3.12"
dependencies = ["typer>=0.12,<1"]

[project.scripts]
tmnt = "tmnt_design_studio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/cardcade/CALIBRATION_V1_*/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Preserve exact historical candidates; only their known import-order and
# pre-existing zip(strict=) findings are excluded from lint.
".diag003-memory-independent-review/300-game-exploratory-r1/verify_completed_batch.candidate.py" = ["I001", "B905"]
".diag003-memory-independent-review/verifier-trust-review/sources/verify_completed_batch.py" = ["I001", "B905"]
