name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      # PR #374 has its own exact synthetic-only test allowlist. Its historical
      # full-suite tests include complete-game simulations and must not run here.
      - name: Full test suite (all other refs and pull requests)
        if: github.ref != 'refs/heads/fix/cardcade-300-wrapper-integrity' && (github.event_name != 'pull_request' || github.event.pull_request.number != 374)
        run: uv run pytest
      - name: Canonical terminology scan
        run: |
          ! grep -R -n -E 'Casual Deck|Design Profile' README.md src tests
