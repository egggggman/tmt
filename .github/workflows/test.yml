name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ (startsWith(github.head_ref, 'review/fresh900-') || startsWith(github.ref_name, 'review/fresh900-')) && '3.13.15' || '3.12' }}
      - run: uv sync --locked --dev --python python
        env:
          UV_LINK_MODE: copy
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Fresh 900 synthetic-only review (no gameplay)
        if: startsWith(github.head_ref, 'review/fresh900-') || startsWith(github.ref_name, 'review/fresh900-')
        env:
          PYTHONHASHSEED: "0"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          uv run python -s -B -c "import pathlib, subprocess, sys; subprocess.run([str(pathlib.Path(sys.executable).resolve()), '-P', '-s', '-B', 'tests/run_fresh900_mock_tests.py', str(pathlib.Path(sys.prefix) / 'lib/python3.13/site-packages')], check=True)"
      - name: Full regression outside restricted Fresh 900 review
        if: ${{ !startsWith(github.head_ref, 'review/fresh900-') && !startsWith(github.ref_name, 'review/fresh900-') }}
        run: uv run pytest
      - name: Canonical terminology scan
        run: |
          ! grep -R -n -E 'Casual Deck|Design Profile' README.md src tests
