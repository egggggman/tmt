name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Fresh 900 synthetic-only review (no gameplay)
        if: github.head_ref == 'review/fresh900-minimal' || github.ref_name == 'review/fresh900-minimal'
        env:
          PYTHONHASHSEED: "0"
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run python -s -B -m pytest -q tests/test_fresh900.py tests/test_calibration_integrity.py tests/test_bad_guys_calibration_entrypoint.py
      - name: Full regression outside restricted Fresh 900 review
        if: github.head_ref != 'review/fresh900-minimal' && github.ref_name != 'review/fresh900-minimal'
        run: uv run pytest
      - name: Canonical terminology scan
        run: |
          ! grep -R -n -E 'Casual Deck|Design Profile' README.md src tests
